# 09 – Shared Memory Zones Fundamentals
#
# Task:
#   1) Define a shared memory zone with limit_req_zone:
#        zone=req_zone:64k
#   2) Apply it with limit_req using zone=req_zone
#   3) Make sure "/" returns HTTP 200 when not limited

events { worker_connections 1024; }

http {
    # TODO: define the shared memory zone here (must be req_zone:64k)

    server {
        listen 8080;
        server_name localhost;

        # Serve a real file: a "return" would answer before limit_req runs.
        root /usr/share/nginx/html;
        index index.html;

        location / {
            # TODO: apply the zone here (must reference req_zone)
        }
    }
}
