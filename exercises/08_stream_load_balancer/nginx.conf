# 08 – TCP Load Balancer (Layer 4, stream)
# Task:
#   - Use stream {} (not http {})
#   - Configure two backends:
#       127.0.0.1:9001
#       127.0.0.1:9002
#   - Listen on 9000 and proxy_pass to the upstream

events {
    worker_connections 1024;
}

http {
    # Optional: log to stdout so docker logs can show it
    log_format tcp_main '$remote_addr -> $upstream_addr [$time_local] status=$status';
    access_log /dev/stdout tcp_main;

    upstream tcp_backend {
        # TODO: add BOTH backend servers

        
    }

    server {
        # Frontend TCP entrypoint
        listen 9000;

        # TODO: forward TCP connections to the upstream
    }
}
