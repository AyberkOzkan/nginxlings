user  www-data;
worker_processes auto;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    ##
    # Basic Settings
    ##

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    # In this lab we don't use a separate mime.types file.
    default_type text/plain;

    ##
    # Logging
    ##

    access_log  logs/access.log;

    ##
    # Gzip
    ##

    gzip on;

    ##
    # Extra configuration files
    ##

    # TODO:
    
    # In a real system, a common pattern is:
    #   include /etc/nginx/conf.d/*.conf;
    # In this lab, you should include configs from the local conf.d/ directory.
    # Fix this line so that NGINX loads *.conf files from ./conf.d/
    #include conf.d/*.conf;
}

