user  www-data;
worker_processes auto;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    ##
    # Basic Settings
    ##

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    # In this lab we don't use a separate mime.types file.
    default_type text/plain;

    ##
    # Logging
    ##

    access_log  logs/access.log;

    ##
    # Gzip
    ##

    gzip on;

    ##
    # Extra configuration files
    ##

    # TODO: load every .conf file from the conf.d/ directory next to this
    # file. (A packaged install does the same with /etc/nginx/conf.d/*.conf;
    # in this lab, relative paths are resolved against this directory.)
}

