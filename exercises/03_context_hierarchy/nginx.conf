# 03 – Context Hierarchy lab
# NOTE:
#   Some directives in this file are intentionally placed
#   in the wrong context. Use the README and nginx -t output
#   to fix the hierarchy.

worker_processes  auto;
error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # HTTP-level settings
    sendfile            on;
    keepalive_timeout   65;
    default_type        text/plain;

    access_log  logs/access.log;
}

# INTENTIONALLY BROKEN CONTEXT SECTION
# The directive placement below is NOT correct.
# Fix the context hierarchy so that:
#   - listen / server_name live in a server block
#   - location lives inside a server block
#   - server lives inside the http block

listen      8080;          # <-- wrong context on purpose
server_name localhost;     # <-- wrong context on purpose

server {
    root   .;
    index  index.html;

    location / {
        return 200 "context-hierarchy-ok\n";
    }
}

