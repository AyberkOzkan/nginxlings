# Exercise 12 - Logs & Variables

events {
    worker_connections 1024;
}

http {
    # TODO: define a log format named "main". It must include at least
    # $remote_addr, $status, $request and $http_user_agent.

    # TODO: write the access log in the "main" format to /dev/stdout, so the
    # check can read it with docker logs.

    server {
        listen 8080;
        server_name localhost;

        # Keep this endpoint simple: it must return HTTP 200 for "/"
        location / {
            return 200 "logs-variables-ok\n";
        }
    }
}
