# 07 - HTTP Load Balancer (Layer 7)

events {
    worker_connections 1024;
}

http {
    log_format lb_main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'upstream=$upstream_addr';

    # Send access logs to stdout so the checker can inspect upstream selection.
    access_log /dev/stdout lb_main;

    upstream backend {
        # TODO: replace this placeholder with both local backend servers.
        server 127.0.0.1:65535;
    }

    server {
        listen 8080;
        server_name localhost;

        location / {
            # TODO: proxy requests to the backend upstream.
            return 200 "TODO: configure the HTTP load balancer\n";
        }
    }
}
