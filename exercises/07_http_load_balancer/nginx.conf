# 07 – HTTP Load Balancer (Layer 7)

events {
    worker_connections 1024;
}

http {
    log_format lb_main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'upstream=$upstream_addr';

    # send access logs to stdout for docker logs
    access_log /dev/stdout lb_main;

    upstream backend {
        # two HTTP backends inside the same container
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
    }

    server {
        # frontend HTTP load balancer endpoint inside the container
        listen      8080;
        server_name localhost;

        location / {
            proxy_pass http://backend;

            # optional, but good practice
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

