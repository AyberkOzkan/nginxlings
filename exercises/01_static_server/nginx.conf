
user  www-data;
worker_processes auto;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections 1024;
    # multi_accept on;
}

http {

    ##
    # Basic Settings
    ##

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    # Bu labde ayrı bir mime.types dosyası kullanmıyoruz.
    default_type text/html;

    ##
    # Logging
    ##

    access_log  logs/access.log;

    ##
    # Gzip
    ##

    gzip on;

    ##
    # Virtual Host (Lab)
    ##

    server {
        # Sistem nginx’i ile çakışmaması için 8080 kullanıyoruz.
        listen       8080;
        server_name  localhost;

        # Egzersiz klasörünün kendisi doküman kökü olsun.
        root   .;
        index  index.html;




    }
}
