worker_processes 1;

error_log logs/error.log;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    default_type text/html;
    access_log logs/access.log;

    server {
        listen 8080;
        server_name localhost;

        # TODO: point the document root at this exercise directory.
        root missing;

        # TODO: serve index.html as the default document.
        index missing.html;
    }
}
