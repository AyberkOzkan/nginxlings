user  www-data;
worker_processes auto;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log  logs/access.log;

    server {
        listen 8081;
        server_name localhost;

        # TODO: hand every request for / to backend_app.py on 127.0.0.1:8080.
        location / {
        }
    }
}

