# Exercise 04 - Worker User and Permissions

# TODO: the workers must be able to read the site that the Dockerfile
# prepares in /srv/site. Keep the Dockerfile as it is.
user www-data;

events {
    worker_connections 1024;
}

http {
    default_type text/html;

    server {
        listen 8080;
        server_name localhost;

        root /srv/site;
        index index.html;

        location / {
        }
    }
}
