user www-data;
worker_processes auto;

error_log  logs/error.log;
pid        logs/nginx.pid;

http {
    sendfile on;
    keepalive_timeout 65;
    default_type text/html;

    access_log logs/access.log;

    server {
        listen 8082;
        server_name localhost;

        # Typical distro-style web root (INTENTIONALLY not the lab root)
        root /var/www/html;
        index index.html;

        location / {
        }
    }
}

