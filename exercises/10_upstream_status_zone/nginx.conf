worker_processes 1;

events { worker_connections 1024; }

http {
    # Docker embedded DNS resolver
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream backend {
        # TODO: enable the required shared memory zone.
        # TODO: replace this placeholder with both Docker backend servers.

        server 127.0.0.1:65535;
    }

    server {
        listen 8080;
        server_name localhost;

        # TODO: expose the selected upstream in the X-Upstream response header.

        location / {
            # TODO: proxy requests to the backend upstream.
            return 200 "TODO: configure upstream status tracking\n";

        }
    }
}
