# Exercise 16 - Shared Memory Zone Sizing & Limits


events { worker_connections 1024; }

http {
    default_type text/plain;

    # TODO:
    # This zone is intentionally small (64k). Every distinct key
    # ($binary_remote_addr + ?id=...) needs one state in the zone. When the
    # zone is full, NGINX evicts the least recently used state, so a small
    # zone "forgets" clients it should still be limiting.
    #
    # Requirement to pass:
    # - zone name must stay "req_zone"
    # - size must be >= 256k (e.g., 256k, 512k, 1m)
    #
    # Keep the rate limit as-is. The slow rate (1 request per minute) keeps
    # a limited client limited long enough for the check to see whether the
    # zone still remembers it.
    limit_req_zone $binary_remote_addr$arg_id zone=req_zone:64k rate=1r/m;

    server {
        listen 8080;
        server_name localhost;

        # Deterministic status for rate limiting
        limit_req_status 429;

        location / {
            # Enforce the limit on this endpoint
            limit_req zone=req_zone nodelay;

            # Serve a file instead of using "return": return runs in the
            # rewrite phase, before limit_req (preaccess phase) gets a chance.
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }
    }
}
