# Exercise 16 - Shared Memory Zone Sizing & Limits
# Config language policy: English.

events { worker_connections 1024; }

http {
    default_type text/plain;

    # TODO:
    # This zone is intentionally small (64k). Increase it so the system
    # can store many unique keys without running out of shared memory.
    #
    # Requirement to pass:
    # - zone name must stay "req_zone"
    # - size must be >= 256k (e.g., 256k, 512k, 1m)
    #
    # Keep the rate limit as-is.
    limit_req_zone $binary_remote_addr$arg_id zone=req_zone:64k rate=5r/s;

    server {
        listen 8080;
        server_name localhost;

        # Deterministic status for rate limiting
        limit_req_status 429;

        location / {
            # Enforce the limit on this endpoint
            limit_req zone=req_zone burst=0 nodelay;
            return 200 "zone-sizing-ok\n";
        }
    }
}