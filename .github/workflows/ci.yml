name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Work is merged into develop; main only takes the release pull
      # request from this repository's develop branch.
      - name: Check the pull request's base branch
        if: >-
          github.event_name == 'pull_request' && github.base_ref == 'main' &&
          (github.head_ref != 'develop' || github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "::error::Pull requests into main come from develop. Change the base branch to develop."
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install shellcheck and tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck tmux

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run unit tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Check shell syntax
        run: |
          for script in exercises/*/check.sh exercises/lib/*.sh; do
            bash -n "$script"
          done

      - name: Run shellcheck
        run: |
          find exercises -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
          shellcheck install.sh packaging/*.sh tests/packages/*.sh

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check
